name: CI

# Offline checks on every push: ingestion tests and dbt compilation. No network calls to XM.
on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - run: python -m pytest -q
      - name: dbt parse (SQL and YAML are valid)
        run: dbt parse --project-dir dbt --profiles-dir dbt
