name: colombia_energy
version: "1.0.0"
config-version: 2
profile: colombia_energy

model-paths: ["models"]
test-paths: ["tests"]
macro-paths: ["macros"]

vars:
  data_dir: "data"          # relative to the folder where dbt is run (the repo root)

models:
  colombia_energy:
    staging:   {+materialized: view,  +schema: staging}   # layer 1: typed copy of the sources
    core:      {+materialized: table, +schema: core}      # layer 2: star schema
    metrics:   {+materialized: table, +schema: metrics}   # layer 3: certified metrics
